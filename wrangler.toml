name = "gallagioloot-proxy"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Variables you can override per-deployment.
# Restrict CORS to the GallagioLoot site origin. Localhost is always allowed for dev
# regardless of this value (see src/index.ts corsHeaders()).
[vars]
ALLOWED_ORIGIN = "https://gallagioloot.icehunter.net"

# Optional: enable observability for debugging
[observability]
enabled = true

# Persistent cache for the Raidbots encounter-items lookup and the learned tier-slot cache.
[[kv_namespaces]]
binding = "ENCOUNTER_ITEMS_KV"
id = "d50d2ff681c24da8b3360cca19c740c5"

# Production route.
routes = [{ pattern = "gallagioloot-proxy.icehunter.net", custom_domain = true }]
