<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GallagioLoot</title>
    <script>
      /* Apply the saved theme before first paint (no flash). Keep the key and ids in sync with src/lib/theme.ts. */
      try {
        var t = localStorage.getItem('gallagioloot:theme')
        document.documentElement.dataset.theme = t === 'green' || t === 'red' ? t : 'midnight'
      } catch (e) {
        document.documentElement.dataset.theme = 'midnight'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
